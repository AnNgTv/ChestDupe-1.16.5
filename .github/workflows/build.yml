name: Build Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Build with Gradle
        run: gradle build

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep "version" build.gradle | head -1 | sed -E "s/.*version['\"]?[=:]?['\"]?([^'\"]*).*/\1/" | tr -d ' ')
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "JAR_FILE=ChestDupe-${VERSION}.jar" >> $GITHUB_OUTPUT

      - name: Rename Artifact
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -1)
          if [ -f "$JAR_FILE" ]; then
            mv "$JAR_FILE" "build/libs/ChestDupe-${{ steps.version.outputs.VERSION }}.jar"
          fi

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/*.jar
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ChestDupe v${{ steps.version.outputs.VERSION }}
          body: |
            🎉 **ChestDupe v${{ steps.version.outputs.VERSION }}**
            
            Phiên bản cập nhật mới nhất của mod ChestDupe cho Minecraft 1.16.5
            
            📥 **Tải xuống:** Xem tệp `.jar` ở phần Assets bên dưới
            
            🔄 Tự động build từ source code
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ChestDupe-JAR
          path: build/libs/*.jar
